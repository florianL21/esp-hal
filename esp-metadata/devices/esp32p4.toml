    "very_large_intr_status",
    "gpio_bank_1",
    "spi_octal",
]

[device.soc]
cpu_has_csr_pc = true
rc_fast_clk_default = 20_000_000
rc_slow_clock = 150_000

memory_map = { ranges = [
    { name = "dram", start = 0x4FF0_0000, end = 0x4FFC_0000 },
] }

clocks = { system_clocks = { clock_tree = [
    # High-speed clock sources
    { name = "XTAL_CLK",     type = "source",                      values = "40",  output = "VALUE * 1_000_000", always_on = true },
    { name = "CPLL_CLK",     type = "derived", from = "XTAL_CLK",  values = "360", output = "VALUE * 1_000_000" },
    { name = "RC_FAST_CLK",  type = "source",  output = "20_000_000" },
    { name = "MPLL_CLK",     type = "derived", from = "XTAL_CLK",  values = "500", output = "VALUE * 1_000_000" },
    { name = "SPLL_CLK",     type = "derived", from = "XTAL_CLK",  values = "480", output = "VALUE * 1_000_000" },

    # Low-speed clocks
    { name = "XTAL32K_CLK",  type = "source",  output = "32_768" },
    { name = "RC_SLOW_CLK",  type = "source",  output = "150_000" },
    { name = "OSC_SLOW_CLK", type = "source", output = "32_768" },
    { name = "PLL_LP_CLK",   type = "derived", from = "XTAL32K_CLK",  values = "8", output = "VALUE * 1_000_000" },

    # The root clock switch
    { name = "ROOT_CLK", type = "mux", always_on = true, variants = [
        # source clock      CPU clock
        { name = "XTAL",    outputs = "XTAL_CLK"},
        { name = "RC_FAST", outputs = "RC_FAST_CLK"},
        { name = "PLL",     outputs = "CPLL_CLK" },
    ] },
    # How to model these dividers? They are not just dividing by some value
    { name = "CPU_CLK", type = "divider", output = "ROOT_CLK / DIVISOR" },
    { name = "MEM_CLK", type = "divider", output = "CPU_CLK / DIVISOR" },
    { name = "SYS_CLK", type = "divider", output = "MEM_CLK / DIVISOR" },
    { name = "APB_CLK", type = "divider", output = "SYS_CLK / DIVISOR" },

    # Clocks technically have a divider but are not recommended to be changed, so they will be treated as fixed
    { name = "PLL_F50M_CLK",  type = "derived", from = "MPLL_CLK", output = "50_000_000" },
    { name = "PLL_F25M_CLK",  type = "derived", from = "MPLL_CLK", output = "25_000_000" },
    { name = "PLL_F240M_CLK", type = "derived", from = "SPLL_CLK", output = "240_000_000" },
    { name = "PLL_F160M_CLK", type = "derived", from = "SPLL_CLK", output = "160_000_000" },
    { name = "PLL_F120M_CLK", type = "derived", from = "SPLL_CLK", output = "120_000_000" },
    { name = "PLL_F80M_CLK",  type = "derived", from = "SPLL_CLK", output = "80_000_000" },
    { name = "PLL_F20M_CLK",  type = "derived", from = "SPLL_CLK", output = "20_000_000" },


    { name = "LP_SLOW_CLK", type = "mux", always_on = true, variants = [
        # source clock      CPU clock
        { name = "XTAL32k",  outputs = "XTAL32K_CLK"},
        { name = "RC_SLOW",  outputs = "RC_SLOW_CLK"},
        { name = "OSC_SLOW", outputs = "OSC_SLOW_CLK" },
    ] },

    { name = "LP_FAST_CLK", type = "mux", always_on = true, variants = [
        # source clock      CPU clock
        { name = "XTAL",    outputs = "XTAL_CLK"},
        { name = "RC_FAST", outputs = "RC_FAST_CLK"},
        { name = "PLL",     outputs = "PLL_LP_CLK" },
    ] },

    { name = "LP_DYN_SLOW_CLK", type = "mux", always_on = true, variants = [
        # source clock      CPU clock
        { name = "LP_SLOW", outputs = "LP_SLOW_CLK"},
        { name = "LP_FAST", outputs = "LP_FAST_CLK"},
    ] },

    { name = "LP_DYN_FAST_CLK", type = "mux", always_on = true, variants = [
        # source clock      CPU clock
        { name = "LP_SLOW", outputs = "LP_SLOW_CLK"},
        { name = "LP_FAST", outputs = "LP_FAST_CLK"},
    ] },
    { name = "LP_PERI_CLK", type = "divider", divisors = "0 .. 32", output = "LP_DYN_FAST_CLK / DIVISOR" },

    { name = "XTAL_D2_CLK", type = "divider", output = "XTAL_CLK / 2" },
]}, peripheral_clocks = { templates = [
    # templates
    { name = "clk_en_template", value = "{{control}}::regs().{{clk_register}}().modify(|_, w| w.{{clk_en_field}}().bit(enable));" },
    { name = "rst_template", value = "{{control}}::regs().{{rst_register}}().modify(|_, w| w.{{rst_field}}().bit(reset));" },
    # substitutions
    { name = "control", value = "crate::peripherals::HP_SYS_CLKRST" },
    # {{peripheral}} is derived automatically (e.g. SpiDma -> spi_dma)
], peripheral_clocks = [
    { name = "Systimer", keep_enabled = true, template_params = { clk_register = "soc_clk_ctrl2", clk_en_field = "systimer_apb_clk_en", rst_register = "hp_rst_en1", rst_field = "rst_en_stimer" } },
    { name = "Uart4", clocks = "Uart0", template_params = { clk_register = "peri_clk_ctrl114", clk_en_field = "uart4_clk_en", rst_register = "hp_rst_en1", rst_field = "rst_en_uart4_core" } },
    { name = "Uart3", clocks = "Uart0", template_params = { clk_register = "peri_clk_ctrl113", clk_en_field = "uart3_clk_en", rst_register = "hp_rst_en1", rst_field = "rst_en_uart3_core" } },
    { name = "Uart2", clocks = "Uart0", template_params = { clk_register = "peri_clk_ctrl112", clk_en_field = "uart2_clk_en", rst_register = "hp_rst_en1", rst_field = "rst_en_uart2_core" } },
    { name = "Uart1", clocks = "Uart0", template_params = { clk_register = "peri_clk_ctrl111", clk_en_field = "uart1_clk_en", rst_register = "hp_rst_en1", rst_field = "rst_en_uart1_core" } },
    { name = "Uart0", keep_enabled = true, template_params = { clk_register = "peri_clk_ctrl110", clk_en_field = "uart0_clk_en", rst_register = "hp_rst_en1", rst_field = "rst_en_uart0_core" }, clocks = [
        # TODO: Are these clock selections referenced to this one by writing clocks = "Uart0", or are separate ones generated?
        # Separate ones would be good since these all have their own prescaler
        # TODO: How do function block specific prescalers come into play?
        { name = "FUNCTION_CLOCK", type = "mux", default = "XTAL", variants = [ # UART_SCLK
            { name = "PLL80",      outputs = "PLL_F80M_CLK" },
            { name = "RC_FAST",  outputs = "RC_FAST_CLK" },
            { name = "XTAL",     outputs = "XTAL_CLK" },
        ] },
    ] },
    # TODO: Timergroup clk enables now seem to happen on a per timer level, not just for the whole group at once
    { name = "Timg1", clocks = "Timg0", template_params = { clk_register = "peri_clk_ctrl20", clk_en_field = "timergrp1_t0_clk_en", rst_register = "hp_rst_en1", rst_field = "rst_en_timergrp0" } },
    { name = "Timg0", keep_enabled = true, template_params = { clk_register = "peri_clk_ctrl21", clk_en_field = "timergrp0_t0_clk_en", rst_register = "hp_rst_en1", rst_field = "rst_en_timergrp1" }, clocks = [
        { name = "FUNCTION_CLOCK", type = "mux", variants = [
            { name = "PLL80",      outputs = "PLL_F80M_CLK" },
            { name = "RC_FAST",  outputs = "RC_FAST_CLK" },
            { name = "XTAL",     outputs = "XTAL_CLK" },
        ] },
    ] },
]}}

[device.timergroup]
support_status = "partial"
instances = [{ name = "timg0" }, { name = "timg1" }]
timg_has_divcnt_rst = true

